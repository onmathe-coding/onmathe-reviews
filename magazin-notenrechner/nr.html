<section class="mag-wide mag-calcband mnr" id="mnr" aria-labelledby="notenrechner">
<div class="mag-ct">
<h2 id="notenrechner">Notenrechner: Fachnote berechnen</h2>
<p>Wähle die Noten deiner Klassenarbeiten und deine mündliche Note aus und tippe auf Berechnen. Alles wird nur in deinem Browser gerechnet, nichts wird gespeichert.</p>
</div>
<div class="mag-calc mnr-calc">
<div class="mnr-in">
<div class="mnr-step" role="group" aria-labelledby="mnr-l1">
<p class="mnr-lab" id="mnr-l1"><span class="mnr-nr" aria-hidden="true">1</span>Noten deiner Klassenarbeiten</p>
<div class="mnr-noten" id="mnr-arb"></div>
<button type="button" class="mnr-add" id="mnr-add">+ Weitere Arbeit</button>
</div>
<div class="mnr-step">
<label class="mnr-lab" for="mnr-m"><span class="mnr-nr" aria-hidden="true">2</span>Deine mündliche Note</label>
<div class="mnr-noten"><span class="mnr-sel"><select id="mnr-m"></select></span></div>
</div>
<button type="button" class="mnr-go" id="mnr-go">Berechnen</button>
</div>
<div class="mnr-out" id="mnr-out" aria-live="polite"><p class="mnr-leer">Hier siehst du gleich deine Fachnote.</p></div>
</div>
</section>
