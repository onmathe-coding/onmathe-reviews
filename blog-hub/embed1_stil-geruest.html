<style>
/* OnMathe Blog-Hub /blog: Suche, Themenkarten, Lernpfade.
   Alle Regeln sind auf .obs-hub bzw. obs-Klassen begrenzt, das globale Stylesheet bleibt unberuehrt. */
:root{--obs-nav-h:74px;--obs-band-h:80px}
html{scroll-padding-top:calc(var(--obs-nav-h) + var(--obs-band-h) + 12px)}
html.obs-lock{overflow:hidden}
html:not(.obs-on) .obs-js{display:none!important}
html.obs-on .section-blog-posts,#obs-data{display:none!important}

.obs-hub{
  --ink:#1c2638;--ink-2:#34405a;--muted:#5b6578;--line:#e3e7ee;--soft:#f6f7f9;
  --paper:#fff;--accent:#ff8a00;--accent-ink:#a35200;--accent-tint:#fff4e8;
  --hi:rgba(255,138,0,.28);--green:#25853a;
  position:relative;color:var(--ink);font-size:16px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;text-align:left
}
.obs-hub *,.obs-hub *::before,.obs-hub *::after{box-sizing:border-box}
.obs-hub h1,.obs-hub h2,.obs-hub h3,.obs-hub p,.obs-hub ol,.obs-hub ul,.obs-hub form,.obs-hub label{margin:0}
.obs-hub ol,.obs-hub ul{padding:0;list-style:none}
.obs-hub h1,.obs-hub h2,.obs-hub h3{font-family:inherit;color:inherit}
.obs-hub a{color:var(--accent-ink)}
.obs-hub button{font:inherit;color:inherit;margin:0;line-height:inherit;text-transform:none}
.obs-hub input{margin:0;font:inherit;line-height:normal}
.obs-hub :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.obs-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.obs-wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.obs-svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.obs-clear[hidden],.obs-panel[hidden]{display:none}

/* Marker */
.obs-bar{display:block;width:100%;height:5px;margin-top:5px;border-radius:3px;background:var(--accent);opacity:.85}
.obs-answer .ex strong{font-weight:700;background:linear-gradient(transparent 58%,var(--hi) 58%);padding:0 2px;border-radius:2px}

/* Kopfbereich mit dem Blog-Foto */
.obs-photo{position:absolute;z-index:0;top:16px;height:360px;left:max(16px,calc((100% - 1088px) / 2));right:max(16px,calc((100% - 1088px) / 2));border-radius:24px;overflow:hidden;background:var(--ink)}
.obs-photo img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center 30%}
.obs-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,38,56,.55) 0%,rgba(28,38,56,.72) 100%),linear-gradient(45deg,rgba(158,74,0,.5) 0%,rgba(158,74,0,0) 60%)}
.obs-hero,.obs-searchwrap,.obs-after,.obs-band,.obs-content{position:relative;z-index:1}
.obs-hero{text-align:center;padding-top:76px;padding-bottom:18px;color:#fff}
.obs-hub .obs-h1{font-size:clamp(38px,5.4vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.03em;color:#fff}
.obs-mark{position:relative;display:inline-block;padding:0 .08em;isolation:isolate}
.obs-mark::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.2em;border-radius:4px;background:var(--accent);opacity:.85;z-index:-1}
.obs-hub .obs-hero-sub{margin-top:16px;font-size:18px;line-height:1.5;color:rgba(255,255,255,.9)}

/* Suchleiste: bleibt beim Scrollen unter der Kopfzeile stehen */
.obs-searchwrap{position:sticky;top:var(--obs-nav-h);z-index:40;padding-top:12px;padding-bottom:12px}
.obs-searchwrap::before{content:"";position:absolute;inset:0;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 12px 24px -22px rgba(28,38,56,.5);opacity:0;transition:opacity .15s}
.obs-searchwrap.is-stuck::before{opacity:1}
.obs-shell{position:relative;max-width:808px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.obs-search{position:relative}
.obs-row{display:flex;align-items:center;gap:10px}
.obs-hub .obs-form{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:64px;padding:0 8px 0 20px;background:var(--paper);border:2px solid transparent;border-radius:18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);transition:border-color .15s,box-shadow .15s,height .15s}
.obs-hub .obs-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,138,0,.25),0 18px 40px -18px rgba(0,0,0,.5)}
.obs-searchwrap.is-stuck .obs-form{height:52px;border:1.5px solid var(--ink);box-shadow:none}
.obs-form > .obs-svg{width:20px;height:20px;color:var(--ink)}
.obs-hub .obs-form input{flex:1;min-width:0;width:auto;height:100%;padding:0;border:0;outline:0;background:transparent;box-shadow:none;font-size:17px;color:var(--ink);-webkit-appearance:none;appearance:none}
.obs-form input::placeholder{color:#6b7486;opacity:1}
.obs-form input::-webkit-search-cancel-button,.obs-form input::-webkit-search-decoration{display:none;-webkit-appearance:none}
.obs-clear{width:38px;height:38px;padding:0;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.obs-clear:hover{background:var(--soft)}
.obs-go{height:46px;padding:0 20px;border:0;border-radius:13px;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.obs-go:hover{background:#ff9a26}
.obs-searchwrap.is-stuck .obs-go{height:38px;border-radius:10px}
.obs-cancel{display:none;height:44px;padding:0 6px;border:0;background:transparent;font-weight:600;color:var(--accent-ink);cursor:pointer}
.obs-chips{display:none;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.obs-chips::-webkit-scrollbar{display:none}
.obs-searchwrap.is-stuck .obs-chips{display:flex}
.obs-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:500;font-size:14px;line-height:1;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.obs-chip:hover{border-color:var(--accent)}
.obs-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-ink)}
.obs-chip .obs-svg{width:16px;height:16px}

/* Vorschlagsliste */
.obs-panel{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 60px -30px rgba(28,38,56,.5);max-height:min(72vh,660px);overflow:auto;padding:8px;text-align:left;overscroll-behavior:contain}
.obs-g + .obs-g{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.obs-gh{font-weight:600;font-size:12.5px;line-height:1.3;color:var(--muted);padding:8px 10px 4px}
.obs-opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.obs-hub a.obs-opt{color:var(--ink)}
.obs-opt:hover,.obs-opt.is-active{background:var(--soft)}
.obs-ic{flex:0 0 32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink-2)}
.obs-opt:hover .obs-ic,.obs-opt.is-active .obs-ic{background:var(--paper)}
.obs-opt.is-calc .obs-ic{background:var(--accent-tint);color:var(--accent-ink)}
.obs-ot{min-width:0;display:flex;flex-direction:column;gap:2px}
.obs-ot .t{font-weight:600;font-size:15px;line-height:1.3}
.obs-ot .s{font-size:13px;line-height:1.35;color:var(--muted)}
.obs-hub mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
.obs-answer{position:relative;margin:6px 4px 8px;padding:16px 18px 14px;border:1px solid #ffd7ad;background:var(--accent-tint);border-radius:16px}
.obs-answer .lbl{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3;color:var(--ink-2)}
.obs-answer .q{font-weight:700;font-size:16.5px;line-height:1.35;margin:10px 0 6px}
.obs-answer .ex{font-size:15px;line-height:1.6;color:var(--ink-2)}
.obs-dmath{display:block;margin:6px 0;overflow-x:auto;overflow-y:hidden}
.obs-dmath .katex-display{margin:0}
.obs-hub .obs-more{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 0;font-weight:600;font-size:14px;color:var(--accent-ink);text-decoration:none;border-radius:6px}
.obs-more.is-active{text-decoration:underline;text-underline-offset:3px}
.obs-avs{display:inline-flex;flex:0 0 auto}
.obs-av{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);background:var(--soft) center/cover no-repeat;display:inline-block}
